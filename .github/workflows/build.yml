name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply app logo and notification icons
        run: |
          R=android/app/src/main/res
          cp -r resources/android/mipmap-* resources/android/drawable $R/
          rm -f $R/mipmap-*/ic_launcher_foreground.webp $R/mipmap-*/ic_launcher.webp $R/mipmap-*/ic_launcher_round.webp
          mkdir -p $R/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B7A75</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          ls $R/drawable $R/mipmap-xxhdpi
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application#' $M
          grep -n "uses-permission" $M
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: amir-flow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
