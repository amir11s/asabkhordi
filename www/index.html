<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a75">
<title>Amir Flow</title>
<style>
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
[hidden]{display:none!important}
:root{--bg:#eef3f6;--card:#fff;--tx:#10222b;--mut:#62767f;--line:#d9e3e8;--acc:#0b7a75;--acc2:#1d4ed8;--acc3:#7c3aed;--soft:#dff3f1;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1519;--card:#162329;--tx:#e8f1f4;--mut:#93a8b0;--line:#26373e;--acc:#2dd4bf;--acc2:#60a5fa;--acc3:#a78bfa;--soft:#10312f;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1519;--card:#162329;--tx:#e8f1f4;--mut:#93a8b0;--line:#26373e;--acc:#2dd4bf;--acc2:#60a5fa;--acc3:#a78bfa;--soft:#10312f;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px;direction:ltr}
.logo i{font-style:normal;color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.bell{background:var(--soft);color:var(--acc);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh b{font-size:18px}
.nav{width:38px;height:38px;border-radius:12px;background:var(--bg);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:12px;color:var(--mut);padding:4px 0}
.d{position:relative;aspect-ratio:1;border-radius:12px;font-size:15px;display:flex;align-items:center;justify-content:center;background:transparent}
.d.fri{color:#dc2626}
.d.today{outline:2px solid var(--acc);outline-offset:-2px}
.d.sel{background:var(--acc);color:#fff;font-weight:700}
.d .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--acc2)}
.d.sel .dot{background:#fff}
.day{margin-top:14px}
.day h2{font-size:17px;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.day h2 small{font-weight:400;color:var(--mut);font-size:13px}
.add{display:grid;gap:8px;margin-bottom:12px}
input[type=text],input[type=time],input[type=number]{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}
.durbox{display:flex;gap:6px;flex:1;min-width:0}
.durbox input,.durbox select{font:inherit;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);min-width:0}
.durbox input{flex:1;width:100%;text-align:center}
.durbox select{flex:none}
.go{background:var(--acc);color:#fff;font-weight:800;padding:11px;border-radius:12px}
.item{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px;margin-bottom:8px;border-inline-start:5px solid var(--acc)}
.item.m{border-color:var(--acc2)}.item.h{border-color:var(--acc3)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow-wrap:anywhere}
.item .t span{font-size:12.5px;color:var(--mut)}
.item.done b{text-decoration:line-through;color:var(--mut)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;font-size:14px;color:#fff}
.item.done .ck{background:var(--acc);border-color:var(--acc)}
.x{color:var(--mut);font-size:20px;padding:0 4px}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:14px}
#toasts{position:fixed;inset:0 0 auto 0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;z-index:20;pointer-events:none;display:grid;gap:8px;max-width:560px;margin:0 auto}
.toast{pointer-events:auto;background:var(--acc);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.end{background:var(--warn);color:#fff}
.toast b{display:block}
.toast button{font-size:20px;color:#fff}
.hdr{display:flex;gap:8px;align-items:center}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.seg.sm{margin:0;padding:3px}.seg.sm button{padding:5px 12px;font-size:13px}
.wr{display:block;width:100%;text-align:start;border-radius:14px;padding:8px 10px;margin-bottom:6px;background:var(--bg);border:2px solid transparent}
.wr.today .wh b{color:var(--acc)}
.wr.sel{border-color:var(--acc)}
.wh{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.wh span{color:var(--mut);font-size:12.5px}
.wi{margin-top:4px;display:grid;gap:4px}
.wi em{color:var(--mut);font-style:normal;font-size:13px}
.wc{display:flex;gap:6px;align-items:center;font-size:13px;border-inline-start:4px solid var(--acc);padding:2px 8px;background:var(--card);border-radius:8px}
.wc.m{border-color:var(--acc2)}.wc.h{border-color:var(--acc3)}
.wc.done{color:var(--mut);text-decoration:line-through}
.wc small{color:var(--mut);flex:none}
.wc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{margin-top:14px}
.sn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.sn div{background:var(--bg);border-radius:14px;padding:8px 4px}
.sn b{display:block;font-size:17px}.sn span{font-size:12px;color:var(--mut)}
.bars,.lbls{display:flex;gap:3px}
.bars{height:84px;align-items:flex-end;margin-bottom:4px}
.b{flex:1;height:100%;display:flex;align-items:flex-end}
.bt{width:100%;background:var(--line);border-radius:4px;min-height:2px;display:flex;align-items:flex-end;overflow:hidden}
.bd{width:100%;background:var(--acc)}
.lbls span{flex:1;text-align:center;font-size:10.5px;color:var(--mut);min-height:14px}
.sub{font-size:12.5px;color:var(--mut);text-align:center;margin-top:8px}
.menub{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;line-height:1}
.hl{display:flex;align-items:center;gap:10px}
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
#drawer{position:fixed;top:0;bottom:0;right:0;width:min(78vw,300px);background:var(--card);z-index:31;transform:translateX(100%);transition:transform .22s,visibility .22s;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px;box-shadow:-8px 0 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:6px}
#drawer:not(.open){visibility:hidden}
#drawer.open{transform:none}
.dh{font-weight:800;font-size:18px;margin:4px 6px 10px}
.mi{display:block;width:100%;text-align:start;padding:12px 14px;border-radius:14px;font-size:15px;font-weight:600}
.mi.on{background:var(--soft);color:var(--acc)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill button{padding:8px 12px;font-weight:600;font-size:14px}
.pill .px{padding:8px 10px 8px 4px;font-size:18px;opacity:.7}
.cnt2{margin-top:14px}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.dnav b{font-size:16px;text-align:center}
.dnav small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.sl{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px;margin-bottom:8px;border-inline-start:5px solid var(--line)}
.sl.f{border-color:var(--acc)}.sl.f.l2{border-color:var(--acc3)}
.sl .tm{flex:none;width:112px;font-size:12.5px;color:var(--mut);line-height:1.4}
.sl .tm b{display:block;color:var(--tx);font-size:13.5px}
.sl input{background:var(--card)}
.sl .x{flex:none}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="ovl" hidden></div>
<nav id="drawer" aria-label="منو">
  <div class="dh">منو</div>
  <button class="mi on" data-p="home">برنامه‌ی من</button>
  <button class="mi" data-p="cn">مشاور تحصیلی</button>
</nav>
<div class="wrap">
<header>
  <div class="hl"><button class="menub" id="menub" aria-label="منو">☰</button><div class="logo">Amir <i>Flow</i></div></div>
  <div class="hdr"><button class="bell" id="perm" hidden>فعال‌سازی اعلان</button><button class="bell" id="theme" aria-label="تغییر تم"></button></div>
</header>
<div id="home">
<div class="seg" id="vsw"><button data-v="m" class="on">ماه</button><button data-v="w">هفته</button></div>
<div class="card" id="mcard">
  <div class="mh">
    <button class="nav" id="next" aria-label="ماه بعد">›</button>
    <b id="title"></b>
    <button class="nav" id="prev" aria-label="ماه قبل">‹</button>
  </div>
  <div class="grid" id="wds"></div>
  <div class="grid" id="days"></div>
</div>
<div class="card" id="wcard" hidden>
  <div class="mh">
    <button class="nav" id="wnext" aria-label="هفته بعد">›</button>
    <b id="wtitle"></b>
    <button class="nav" id="wprev" aria-label="هفته قبل">‹</button>
  </div>
  <div id="wlist"></div>
</div>
<div class="day card" id="panel">
  <h2><span id="dt"></span><small id="cnt"></small></h2>
  <div class="add">
    <input type="text" id="ti" placeholder="چه کاری برنامه داری؟" maxlength="80">
    <div class="row">
      <input type="time" id="tm" style="max-width:130px">
      <div class="durbox">
        <input type="number" id="dv" value="30" min="1" step="1" inputmode="numeric" aria-label="مدت">
        <select id="du" aria-label="واحد"><option value="1">دقیقه</option><option value="60">ساعت</option></select>
      </div>
    </div>
    <button class="go" id="addb">افزودن به برنامه</button>
  </div>
  <div id="list"></div>
</div>
<div class="card stats">
  <div class="mh"><b>آمار</b><div class="seg sm" id="ssw"><button data-s="w" class="on">هفته</button><button data-s="m">ماه</button></div></div>
  <div id="sbody"></div>
</div>
</div>
<div id="cn" hidden>
  <div class="card">
    <div class="mh"><b>دانش‌آموزان من</b><small id="cnc" style="color:var(--mut)"></small></div>
    <div class="row"><input type="text" id="sn" placeholder="نام دانش‌آموز" maxlength="40"><button class="go" id="sadd" style="padding:0 18px;flex:none">افزودن</button></div>
    <div class="pills" id="slist"></div>
  </div>
  <div class="card cnt2" id="splan" hidden>
    <div class="mh"><b id="spn"></b></div>
    <div class="dnav">
      <button class="nav" id="dnext" aria-label="روز بعد">›</button>
      <b id="dtt"></b>
      <button class="nav" id="dprev" aria-label="روز قبل">‹</button>
    </div>
    <div class="add">
      <input type="text" id="at" placeholder="درس یا برنامه" maxlength="120">
      <div class="row">
        <input type="time" id="atm" style="max-width:130px">
        <div class="durbox">
        <input type="number" id="adv" value="30" min="1" step="1" inputmode="numeric" aria-label="مدت">
        <select id="adu" aria-label="واحد"><option value="1">دقیقه</option><option value="60">ساعت</option></select>
      </div>
      </div>
      <button class="go" id="aadd">افزودن به برنامه</button>
    </div>
    <div id="sgrid"></div>
  </div>
</div>
</div>
<script>
(function(){
var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var WN=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function toJ(gy,gm,gd){var g=[0,31,59,90,120,151,181,212,243,273,304,334];var y2=gm>2?gy+1:gy;var days=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+g[gm-1];var jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}var jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);var jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function toG(jy,jm,jd){jy+=1595;var days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);var gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}var gd=days+1;var s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];var gm;for(gm=0;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
function dim(y,m){if(m<=6)return 31;if(m<=11)return 30;var g=toG(y,12,30),j=toJ(g[0],g[1],g[2]);return j[1]===12&&j[2]===30?30:29}
function key(y,m,d){return y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d}
function tod(){var n=new Date();return toJ(n.getFullYear(),n.getMonth()+1,n.getDate())}
var store={};
try{store=JSON.parse(localStorage.getItem('amirflow')||'{}')}catch(e){}
function save(){try{localStorage.setItem('amirflow',JSON.stringify(store))}catch(e){}}
var LN=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||null;
var CH='amirflow-alerts';
if(LN&&LN.createChannel)LN.createChannel({id:CH,name:'یادآور برنامه‌ها',description:'شروع و پایان برنامه‌ها',importance:5,visibility:1,vibration:true,lights:true}).catch(function(){});
var lastN=0;function newNid(){var b=Math.floor(Date.now()/1000)%1000000000;if(b<=lastN)b=lastN+1;lastN=b;return b*2}
function sched(it,k){
  if(!LN||!it.nid)return;
  var kp=k.split('-'),g=toG(+kp[0],+kp[1],+kp[2]),p=it.start.split(':');
  var st=new Date(g[0],g[1]-1,g[2],+p[0],+p[1]).getTime(),en=st+it.dur*60000,n=Date.now(),a=[];
  if(st>n)a.push({id:it.nid,title:'شروع شد: '+it.title,body:'مدت: '+fmtDur(it.dur),channelId:CH,smallIcon:'ic_stat',largeIcon:'ic_large',schedule:{at:new Date(st),allowWhileIdle:true}});
  if(en>n)a.push({id:it.nid+1,title:'تمام شد: '+it.title,body:'وقت استراحت یا کار بعدی است',channelId:CH,smallIcon:'ic_stat',largeIcon:'ic_large',schedule:{at:new Date(en),allowWhileIdle:true}});
  if(a.length)LN.schedule({notifications:a}).catch(function(){});
}
function unsched(it){if(LN&&it.nid)LN.cancel({notifications:[{id:it.nid},{id:it.nid+1}]}).catch(function(){})}
var T=tod(),cy=T[0],cm=T[1],sel=T.slice(),view='m',smode='w';
var $=function(i){return document.getElementById(i)};
var root=document.documentElement;
function isDark(){var t=root.getAttribute('data-theme');if(t)return t==='dark';return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function paintTheme(){$('theme').textContent=isDark()?'☀️':'🌙';var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.setAttribute('content',isDark()?'#0d1519':'#0b7a75')}
try{var sv=localStorage.getItem('amirflow-theme');if(sv)root.setAttribute('data-theme',sv)}catch(e){}
$('theme').onclick=function(){var n=isDark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('amirflow-theme',n)}catch(e){}paintTheme()};
paintTheme();
function addDays(y,m,d,n){var g=toG(y,m,d),dt=new Date(g[0],g[1]-1,g[2]+n);return toJ(dt.getFullYear(),dt.getMonth()+1,dt.getDate())}
function wdOf(y,m,d){var g=toG(y,m,d);return (new Date(g[0],g[1]-1,g[2]).getDay()+1)%7}
function weekStart(){return addDays(sel[0],sel[1],sel[2],-wdOf(sel[0],sel[1],sel[2]))}
function sortedAt(k){return (store[k]||[]).slice().sort(function(x,y){return x.start<y.start?-1:1})}
var now=new Date();$('tm').value=$('atm').value=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
$('wds').innerHTML=WN.map(function(w){return '<div class="wd">'+w.charAt(0)+'</div>'}).join('');
function fmtDur(m){m=Math.round(m);if(m<60)return fa(m)+' دقیقه';var h=Math.floor(m/60),r=m%60;return fa(h)+' ساعت'+(r?' و '+fa(r)+' دقیقه':'')}
function readDur(v,u){var d=Math.round(parseFloat($(v).value)*(+$(u).value));if(!(d>=1))return 0;return Math.min(d,10080)}
function endStr(st,m){var p=st.split(':'),t=(+p[0])*60+(+p[1])+m;t%=1440;return ('0'+Math.floor(t/60)).slice(-2)+':'+('0'+t%60).slice(-2)}
function fmtT(s){return fa(s)}
function cal(){
  $('title').textContent=MN[cm-1]+' '+fa(cy);
  var g=toG(cy,cm,1),wd=(new Date(g[0],g[1]-1,g[2]).getDay()+1)%7,n=dim(cy,cm),h='';
  for(var i=0;i<wd;i++)h+='<div></div>';
  for(var d=1;d<=n;d++){
    var k=key(cy,cm,d),c='d',col=(wd+d-1)%7===6;
    if(col)c+=' fri';
    if(cy===T[0]&&cm===T[1]&&d===T[2])c+=' today';
    if(cy===sel[0]&&cm===sel[1]&&d===sel[2])c+=' sel';
    h+='<button class="'+c+'" data-d="'+d+'">'+fa(d)+((store[k]&&store[k].length)?'<span class="dot"></span>':'')+'</button>';
  }
  $('days').innerHTML=h;
}
function lst(){
  var k=key(sel[0],sel[1],sel[2]),a=(store[k]||[]).slice().sort(function(x,y){return x.start<y.start?-1:1});
  var g=toG(sel[0],sel[1],sel[2]),w=(new Date(g[0],g[1]-1,g[2]).getDay()+1)%7;
  $('dt').textContent=WN[w]+' '+fa(sel[2])+' '+MN[sel[1]-1];
  $('cnt').textContent=a.length?fa(a.length)+' برنامه':'';
  if(!a.length){$('list').innerHTML='<div class="empty">برای این روز هنوز برنامه‌ای نداری. یکی اضافه کن.</div>';return}
  $('list').innerHTML=a.map(function(it){
    return '<div class="item '+(it.dur>=60?'h':'m')+(it.done?' done':'')+'"><button class="ck" data-ck="'+it.id+'">'+(it.done?'✓':'')+'</button><div class="t"><b></b><span>'+fa(it.start)+' تا '+fa(endStr(it.start,it.dur))+' · '+fmtDur(it.dur)+'</span></div><button class="x" data-rm="'+it.id+'" aria-label="حذف">×</button></div>';
  }).join('');
  var bs=$('list').querySelectorAll('.item .t b');
  a.forEach(function(it,i){bs[i].textContent=it.title});
}
function fmtH(m){if(!m)return fa(0);if(m<60)return fa(m)+' دقیقه';var h=Math.floor(m/60),r=m%60;return fa(h)+' ساعت'+(r?' و '+fa(r)+' دقیقه':'')}
function wk(){
  if(view!=='w')return;
  var ws=weekStart(),we=addDays(ws[0],ws[1],ws[2],6);
  $('wtitle').textContent=(ws[1]===we[1]?fa(ws[2])+' تا '+fa(we[2])+' '+MN[we[1]-1]:fa(ws[2])+' '+MN[ws[1]-1]+' تا '+fa(we[2])+' '+MN[we[1]-1])+' '+fa(we[0]);
  var box=$('wlist');box.textContent='';
  for(var i=0;i<7;i++){
    var d=addDays(ws[0],ws[1],ws[2],i),k=key(d[0],d[1],d[2]),a=sortedAt(k);
    var r=document.createElement('div');r.className='wr'+(d[0]===sel[0]&&d[1]===sel[1]&&d[2]===sel[2]?' sel':'')+(d[0]===T[0]&&d[1]===T[1]&&d[2]===T[2]?' today':'');
    r.setAttribute('role','button');r.dataset.i=i;
    var h=document.createElement('div');h.className='wh';
    var b=document.createElement('b'),sp=document.createElement('span');b.textContent=WN[i];sp.textContent=fa(d[2])+' '+MN[d[1]-1];
    h.appendChild(b);h.appendChild(sp);r.appendChild(h);
    var w=document.createElement('div');w.className='wi';
    if(!a.length){var em=document.createElement('em');em.textContent='بدون برنامه';w.appendChild(em)}
    a.forEach(function(it){
      var c=document.createElement('div');c.className='wc '+(it.dur>=60?'h':'m')+(it.done?' done':'');
      var sm=document.createElement('small'),t=document.createElement('span');
      sm.textContent=fa(it.start);t.textContent=it.title;c.appendChild(sm);c.appendChild(t);w.appendChild(c);
    });
    r.appendChild(w);box.appendChild(r);
  }
}
function stat(){
  var keys=[],labels=[],title;
  if(smode==='w'){
    var ws=weekStart();
    for(var i=0;i<7;i++){var d=addDays(ws[0],ws[1],ws[2],i);keys.push(key(d[0],d[1],d[2]));labels.push(WN[i].charAt(0))}
    title='هفته‌ی '+fa(ws[2])+' '+MN[ws[1]-1];
  }else{
    var n=dim(cy,cm);
    for(var j=1;j<=n;j++){keys.push(key(cy,cm,j));labels.push(j===1||j%5===0?fa(j):'')}
    title=MN[cm-1]+' '+fa(cy);
  }
  var cnt=0,done=0,tot=0,dm=0,per=[];
  keys.forEach(function(k){
    var a=store[k]||[],t=0,x=0;
    a.forEach(function(it){cnt++;t+=it.dur;if(it.done){done++;x+=it.dur}});
    tot+=t;dm+=x;per.push([t,x]);
  });
  var mx=0;per.forEach(function(p){if(p[0]>mx)mx=p[0]});
  var pct=cnt?Math.round(done/cnt*100):0;
  var h='<div class="sn"><div><b>'+fa(cnt)+'</b><span>برنامه</span></div><div><b>'+fmtH(tot)+'</b><span>زمان برنامه‌ریزی</span></div><div><b>'+fa(pct)+'٪</b><span>انجام‌شده</span></div></div>';
  h+='<div class="bars">'+per.map(function(p){var ht=mx?Math.max(p[0]/mx*100,p[0]?6:0):0,dh=p[0]?p[1]/p[0]*100:0;return '<div class="b"><div class="bt" style="height:'+ht+'%"><div class="bd" style="height:'+dh+'%"></div></div></div>'}).join('')+'</div>';
  h+='<div class="lbls">'+labels.map(function(l){return '<span>'+l+'</span>'}).join('')+'</div>';
  h+='<div class="sub">'+title+' · '+fa(done)+' از '+fa(cnt)+' برنامه انجام شد'+(dm?' · '+fmtH(dm)+' زمان انجام‌شده':'')+'</div>';
  $('sbody').innerHTML=h;
}
function draw(){cal();wk();lst();stat()}
function setView(v){
  view=v;cy=sel[0];cm=sel[1];
  $('mcard').hidden=v!=='m';$('wcard').hidden=v!=='w';
  [].forEach.call($('vsw').children,function(c){c.classList.toggle('on',c.dataset.v===v)});
  draw();
}
$('vsw').onclick=function(e){var b=e.target.closest('button');if(b)setView(b.dataset.v)};
$('ssw').onclick=function(e){var b=e.target.closest('button');if(!b)return;smode=b.dataset.s;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===b)});stat()};
function shiftWeek(n){sel=addDays(sel[0],sel[1],sel[2],n);cy=sel[0];cm=sel[1];draw()}
$('wnext').onclick=function(){shiftWeek(7)};
$('wprev').onclick=function(){shiftWeek(-7)};
$('wlist').onclick=function(e){var r=e.target.closest('.wr');if(!r)return;var d=addDays(weekStart()[0],weekStart()[1],weekStart()[2],+r.dataset.i);sel=d;cy=d[0];cm=d[1];draw();$('panel').scrollIntoView({behavior:'smooth',block:'start'})};
$('prev').onclick=function(){cm--;if(cm<1){cm=12;cy--}cal();stat()};
$('next').onclick=function(){cm++;if(cm>12){cm=1;cy++}cal();stat()};
$('days').onclick=function(e){var b=e.target.closest('.d');if(!b)return;sel=[cy,cm,+b.dataset.d];draw()};
$('addb').onclick=function(){
  var t=$('ti').value.trim();if(!t){$('ti').focus();return}
  var tm=$('tm').value;if(!tm){$('tm').focus();return}
  var dur=readDur('dv','du');if(!dur){$('dv').focus();return}
  var k=key(sel[0],sel[1],sel[2]);var it={id:Date.now()+''+Math.floor(Math.random()*99),nid:newNid(),title:t,start:tm,dur:dur,done:false,ns:false,ne:false};(store[k]=store[k]||[]).push(it);sched(it,k);
  save();$('ti').value='';draw();askPerm();
};
$('ti').onkeydown=function(e){if(e.key==='Enter')$('addb').click()};
$('list').onclick=function(e){
  var k=key(sel[0],sel[1],sel[2]),a=store[k]||[],c=e.target.closest('[data-ck]'),r=e.target.closest('[data-rm]');
  if(c){a.forEach(function(i){if(i.id===c.dataset.ck){i.done=!i.done;if(i.done)unsched(i);else sched(i,k)}})}
  if(r){a.forEach(function(i){if(i.id===r.dataset.rm)unsched(i)});store[k]=a.filter(function(i){return i.id!==r.dataset.rm})}
  save();draw();
};
function toast(title,body,end){
  var d=document.createElement('div');d.className='toast'+(end?' end':'');
  var s=document.createElement('div'),b=document.createElement('b'),p=document.createElement('span'),x=document.createElement('button');
  b.textContent=title;p.textContent=body;x.textContent='×';x.onclick=function(){d.remove()};
  s.appendChild(b);s.appendChild(p);d.appendChild(s);d.appendChild(x);$('toasts').appendChild(d);
}
function beep(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(function(){o.stop();c.close()},350)}catch(e){}}
function notify(title,body,end){
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body:body,icon:'logo.png'})}catch(e){}
  toast(title,body,end);beep();
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function askPerm(){if(LN){LN.checkPermissions().then(function(r){if(r.display!=='granted')$('perm').hidden=false}).catch(function(){});return}try{if('Notification' in window&&Notification.permission==='default')$('perm').hidden=false}catch(e){}}
$('perm').onclick=function(){if(LN){LN.requestPermissions().then(function(){$('perm').hidden=true}).catch(function(){});return}try{Notification.requestPermission().then(function(){$('perm').hidden=true})}catch(e){}};
askPerm();
function tick(){
  if(LN)return;
  var n=new Date(),tj=toJ(n.getFullYear(),n.getMonth()+1,n.getDate()),k=key(tj[0],tj[1],tj[2]),a=store[k]||[],ch=false;
  a.forEach(function(it){
    if(it.done)return;
    var p=it.start.split(':'),st=new Date(n.getFullYear(),n.getMonth(),n.getDate(),+p[0],+p[1]).getTime(),en=st+it.dur*60000,t=n.getTime();
    if(!it.ns&&t>=st&&t<en){it.ns=true;ch=true;notify('شروع شد: '+it.title,'مدت: '+fmtDur(it.dur),false)}
    if(!it.ne&&t>=en&&t<en+600000){it.ne=true;it.ns=true;ch=true;notify('تمام شد: '+it.title,'وقت استراحت یا کار بعدی است',true)}
  });
  if(ch){save();lst()}
}
setInterval(tick,10000);tick();
document.addEventListener('visibilitychange',function(){if(!document.hidden){T=tod();tick();draw()}});
/* ---- منو و مشاور تحصیلی ---- */
var CN={students:[],plans:{}},cnSel=null,cnDay=T.slice();
try{var cj=JSON.parse(localStorage.getItem('amirflow-cn')||'null');if(cj&&cj.students&&cj.plans)CN=cj}catch(e){}
(function(){var ch=false;Object.keys(CN.plans).forEach(function(sid){var pl=CN.plans[sid];Object.keys(pl).forEach(function(k){pl[k].forEach(function(it,i){if(it.start===undefined){it.start=(it.s<10?'0':'')+it.s+':00';it.dur=(it.d||1)*60;it.id=it.id||(Date.now()+''+i);ch=true}})})});if(ch)try{localStorage.setItem('amirflow-cn',JSON.stringify(CN))}catch(e){}})();
if(CN.students.length)cnSel=CN.students[0].id;
function cnSave(){try{localStorage.setItem('amirflow-cn',JSON.stringify(CN))}catch(e){}}
function openMenu(o){$('drawer').classList.toggle('open',o);$('ovl').hidden=!o}
$('menub').onclick=function(){openMenu(true)};
$('ovl').onclick=function(){openMenu(false)};
function showPage(p){
  $('home').hidden=p!=='home';$('cn').hidden=p!=='cn';
  [].forEach.call($('drawer').querySelectorAll('.mi'),function(b){b.classList.toggle('on',b.dataset.p===p)});
  openMenu(false);window.scrollTo(0,0);
  if(p==='cn')cnDraw();
}
$('drawer').onclick=function(e){var b=e.target.closest('.mi');if(b)showPage(b.dataset.p)};
function pad2(n){return (n<10?'0':'')+n}
function cnItems(sid,k){return ((CN.plans[sid]||{})[k])||[]}
function cnStu(){
  var box=$('slist');box.textContent='';
  $('cnc').textContent=CN.students.length?fa(CN.students.length)+' نفر':'';
  if(!CN.students.length){var e=document.createElement('div');e.className='empty';e.style.width='100%';e.textContent='هنوز دانش‌آموزی اضافه نکرده‌اید.';box.appendChild(e);return}
  CN.students.forEach(function(st){
    var p=document.createElement('div');p.className='pill'+(st.id===cnSel?' on':'');
    var b=document.createElement('button'),x=document.createElement('button');
    b.textContent=st.name;x.textContent='×';x.className='px';x.setAttribute('aria-label','حذف');
    b.onclick=function(){cnSel=st.id;cnDraw()};
    x.onclick=function(){
      if(!confirm('«'+st.name+'» و همه‌ی برنامه‌هایش حذف شود؟'))return;
      CN.students=CN.students.filter(function(q){return q.id!==st.id});delete CN.plans[st.id];
      if(cnSel===st.id)cnSel=CN.students.length?CN.students[0].id:null;
      cnSave();cnDraw();
    };
    p.appendChild(b);p.appendChild(x);box.appendChild(p);
  });
}
function cnGrid(){
  var st=CN.students.filter(function(q){return q.id===cnSel})[0];
  $('splan').hidden=!st;
  if(!st)return;
  $('spn').textContent='برنامه‌ی '+st.name;
  var w=wdOf(cnDay[0],cnDay[1],cnDay[2]);
  var isT=cnDay[0]===T[0]&&cnDay[1]===T[1]&&cnDay[2]===T[2];
  $('dtt').innerHTML='<span></span><small></small>';
  $('dtt').firstChild.textContent=WN[w]+' '+fa(cnDay[2])+' '+MN[cnDay[1]-1];
  $('dtt').lastChild.textContent=fa(cnDay[0])+(isT?' · امروز':'');
  var k=key(cnDay[0],cnDay[1],cnDay[2]),sid=st.id,box=$('sgrid');
  var arr=cnItems(sid,k).slice().sort(function(x,y){return x.start<y.start?-1:1});
  box.textContent='';
  if(!arr.length){var e=document.createElement('div');e.className='empty';e.textContent='برای این روز هنوز برنامه‌ای نیست.';box.appendChild(e);return}
  arr.forEach(function(it){
    var d=document.createElement('div');d.className='sl f'+(it.dur>=60?' l2':'');
    var tm=document.createElement('div');tm.className='tm';
    var b=document.createElement('b');b.textContent=fa(it.start)+' تا '+fa(endStr(it.start,it.dur));
    var sp=document.createElement('span');sp.textContent=fmtDur(it.dur);
    tm.appendChild(b);tm.appendChild(sp);
    var inp=document.createElement('input');inp.type='text';inp.maxLength=120;inp.value=it.t;
    inp.onchange=function(){var t=inp.value.trim();if(t){it.t=t;cnSave()}else inp.value=it.t};
    var x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','حذف');
    x.onclick=function(){var pl=CN.plans[sid],a2=pl[k];a2.splice(a2.indexOf(it),1);if(!a2.length)delete pl[k];cnSave();cnGrid()};
    d.appendChild(tm);d.appendChild(inp);d.appendChild(x);box.appendChild(d);
  });
}
function cnDraw(){cnStu();cnGrid()}
$('sadd').onclick=function(){
  var n=$('sn').value.trim();if(!n){$('sn').focus();return}
  var id=Date.now()+''+Math.floor(Math.random()*99);
  CN.students.push({id:id,name:n});cnSel=id;cnSave();$('sn').value='';cnDraw();
};
$('sn').onkeydown=function(e){if(e.key==='Enter')$('sadd').click()};
$('dnext').onclick=function(){cnDay=addDays(cnDay[0],cnDay[1],cnDay[2],1);cnGrid()};
$('dprev').onclick=function(){cnDay=addDays(cnDay[0],cnDay[1],cnDay[2],-1);cnGrid()};
$('aadd').onclick=function(){
  var t=$('at').value.trim();if(!t){$('at').focus();return}
  var tm=$('atm').value;if(!tm){$('atm').focus();return}
  var dur=readDur('adv','adu');if(!dur){$('adv').focus();return}
  if(!cnSel)return;
  var k=key(cnDay[0],cnDay[1],cnDay[2]),pl=CN.plans[cnSel]=CN.plans[cnSel]||{};
  (pl[k]=pl[k]||[]).push({id:Date.now()+''+Math.floor(Math.random()*99),start:tm,dur:dur,t:t});
  $('at').value='';cnSave();cnGrid();
};
$('at').onkeydown=function(e){if(e.key==='Enter')$('aadd').click()};
draw();
})();
</script>
</body>
</html>
